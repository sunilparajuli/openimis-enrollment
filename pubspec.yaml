name: openimis_app
version: 1.0.0+1
publish_to: none
description: A new Flutter project.
environment: 
  sdk: '>=2.18.0 <4.0.0'

dependencies:
  cupertino_icons: ^1.0.2
  change_app_package_name:
  get: 4.6.5
  flutter_typeahead: ^4.3.0
  google_fonts:
  flutter_screenutil: 5.9.3
  cached_network_image:
  image_picker:
  image_cropper:
  file_picker:
  qr_code_scanner: 1.0.1
  qr_flutter:
  local_auth: ^2.1.4
  sqflite: ^2.0.0+4
  path: ^1.8.0
  firebase_core:
  firebase_messaging:
  flutter_svg:
  lottie: ^3.0.0
  carousel_slider: ^5.0.0
  flutter_markdown: 0.6.12
  persistent_bottom_nav_bar_v2: 4.2.5
  dio: 4.0.6
  get_it: 7.2.0
  freezed_annotation: ^2.1.0
  json_annotation: ^4.7.0
  intl:
  flutter_image_compress:
  otp_text_field:
  get_storage: 2.0.3
  heroicons:
  form_field_validator: 1.1.0
  intl_phone_field: 3.1.0
  shimmer: 2.0.0
  awesome_dialog:
  awesome_snackbar_content:
  country_codes: ^3.2.0
  smooth_page_indicator: 1.0.0+2
  url_launcher:
  url_launcher_ios:
  flutter_svg_provider:
  expandable: 5.0.1
  khalti_flutter: 2.1.0
  flutter_local_notifications:
  connectivity_plus: ^5.0.2
  webview_flutter: ^4.4.2
  flutter: 
    sdk: flutter

dependency_overrides:
  intl: 0.20.2
  # Pin flutter_svg to last Dart-3.8-compatible version (Dart 3.9 incompatible versions excluded)
  flutter_svg: 2.0.10+1
  # Override http to satisfy both khalti_flutter and flutter_svg
  http: ^1.0.0
  khalti: ^1.1.0
  # Override win32 to version compatible with Flutter 3.32 (UnmodifiableUint8ListView removed in Dart 3.3)
  win32: ^5.1.1
  # Override file_picker to match win32 ^5.x API (5.3.1 uses old win32 v4 API surface)
  file_picker: ^8.0.5
  # Override device_info_plus to AGP 8 compatible version (8.2.2 uses deprecated package= in AndroidManifest)
  device_info_plus: ^12.3.0
  # Override flutter_keyboard_visibility to 6.0.0 (AGP 8 compatible)
  flutter_keyboard_visibility: 6.0.0
  # Override package_info_plus to 8.1.3 (AGP 8 compatible)
  package_info_plus: ^8.1.3
  # Override flutter_plugin_android_lifecycle to 2.0.31 (remove v1 Registrar dependency)
  flutter_plugin_android_lifecycle: ^2.0.31
  # Override image_picker_android to 0.8.13+1 (fixes Registrar issue, compatible with Dart 3.8)
  image_picker_android: 0.8.13+1
  # Override local_auth_android to 1.0.52 (remove v1 Registrar dependency)
  local_auth_android: 1.0.52
  # Override path_provider_android to 2.2.19 (remove v1 Registrar dependency)
  path_provider_android: 2.2.19
  # Override url_launcher_android to 6.3.20 (remove v1 Registrar dependency)
  url_launcher_android: 6.3.20

dev_dependencies: 
  build_runner: ^2.2.1
  flutter_lints: ^2.0.0
  freezed: ^2.1.1
  json_serializable: ^6.4.0
  flutter_native_splash: ^2.2.13
  logger: 1.1.0
#  device_preview:
  flutter_test: 
    sdk: flutter

flutter_native_splash: 
  color: '#03A9F4'
  color_dark: '#23A9F4'
  android_12: 
    color_dark: '#23A9F4'
  web: false

flutter: 
  assets: 
    - assets/
    - assets/translations.json
  uses-material-design: true
